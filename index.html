<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minimal WebRTC File Share</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101418;
        color: #f5f7fa;
      }

      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        margin-bottom: 18px;
      }

      input,
      button {
        font: inherit;
      }

      button {
        border: 0;
        border-radius: 6px;
        padding: 10px 14px;
        color: #101418;
        background: #77d7b9;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      #status {
        color: #b9c4ce;
      }

      .videos {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 16px;
      }

      .panel {
        min-width: 0;
      }

      h2 {
        margin: 0 0 8px;
        font-size: 16px;
        font-weight: 600;
      }

      video {
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #050607;
        border: 1px solid #2d3740;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="controls">
        <input id="fileInput" type="file" accept="video/*,audio/*" />
        <button id="connectButton">接続 / 共有開始</button>
        <span id="status">未接続</span>
      </div>

      <div class="videos">
        <section class="panel">
          <h2>ローカル</h2>
          <video id="localVideo" controls muted playsinline></video>
        </section>

        <section class="panel">
          <h2>リモート</h2>
          <video id="remoteVideo" autoplay controls playsinline></video>
        </section>
      </div>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
